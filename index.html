<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDo App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <h1>ToDo</h1>

  <form id="todo-form" class="todo-form">
    <input type="text" id="todo-input" placeholder="やることを入力…" autocomplete="off" required>
    <button type="submit">追加</button>
  </form>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="active">未完了</button>
    <button class="filter-btn" data-filter="completed">完了済み</button>
  </div>

  <ul id="todo-list" class="todo-list"></ul>

  <div class="footer">
    <span id="items-left">0 件残り</span>
    <button id="clear-completed">完了済みを削除</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
